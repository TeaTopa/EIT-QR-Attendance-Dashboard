<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Login - QR Attendance</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background: #1e1e2f; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .login-card { background: #27293d; padding: 35px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
        h1 { color: #00d68f; margin-bottom: 20px; font-size: 24px; text-align: center; }
        .toggle-box { display: flex; margin-bottom: 25px; background: #1e1e2f; border-radius: 8px; padding: 4px; }
        .toggle-btn { flex: 1; padding: 10px; border: none; background: transparent; color: #8a8a9e; cursor: pointer; border-radius: 6px; font-weight: bold; }
        .toggle-btn.active { background: #00d68f; color: #000; }
        label { font-size: 14px; color: #b0b0c0; display: block; margin-bottom: 8px; }
        input { width: 100%; padding: 12px; margin-bottom: 20px; border-radius: 6px; border: 1px solid #3d3f58; background: #1e1e2f; color: white; font-size: 16px; }
        input:focus { outline: none; border-color: #00d68f; }
        button.submit-btn { width: 100%; padding: 12px; border: none; border-radius: 6px; background: #00d68f; color: black; font-weight: bold; font-size: 16px; cursor: pointer; }
        button.submit-btn:hover { background: #00b377; }
    </style>
</head>
<body>

    <div class="login-card">
        <h1>Attendance System</h1>
        
        <div class="toggle-box">
            <button class="toggle-btn active" id="btn-student" onclick="setRole('student')">Student</button>
            <button class="toggle-btn" id="btn-admin" onclick="setRole('admin')">Admin</button>
        </div>

        <form id="login-form">
            <div id="input-group">
                <label id="input-label">Student ID</label>
                <input type="text" id="user-input" placeholder="e.g. 050327020077" required>
            </div>
            <button type="submit" class="submit-btn">Login to Portal</button>
        </form>
    </div>

    <script>
        let currentRole = 'student';

        function setRole(role) {
            currentRole = role;
            const btnStudent = document.getElementById('btn-student');
            const btnAdmin = document.getElementById('btn-admin');
            const label = document.getElementById('input-label');
            const input = document.getElementById('user-input');

            if (role === 'student') {
                btnStudent.classList.add('active');
                btnAdmin.classList.remove('active');
                label.innerText = 'Student ID';
                input.placeholder = 'e.g. 050327020077';
                input.type = 'text';
            } else {
                btnAdmin.classList.add('active');
                btnStudent.classList.remove('active');
                label.innerText = 'Admin Passkey';
                input.placeholder = 'Enter Admin Key';
                input.type = 'password';
            }
        }

        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const value = document.getElementById('user-input').value.trim();
            if (!value) return;

            if (currentRole === 'student') {
                localStorage.setItem('student_id', value);
                window.location.href = 'student.html';
            } else {
                // simple admin check (replace admin123 with your preferred key)
                if (value === 'admin123') {
                    localStorage.setItem('admin_logged', 'true');
                    window.location.href = 'admin.html';
                } else {
                    alert('Invalid Admin Passkey!');
                }
            }
        });
    </script>
</body>
</html>
