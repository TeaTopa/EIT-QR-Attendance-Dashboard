<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Attendance Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background: #1e1e2f; color: white; padding: 30px; }
        
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h1 { color: #00d68f; font-size: 24px; }
        
        .top-bar { display: flex; gap: 10px; margin-bottom: 20px; }
        
        /* Buttons */
        button { border: none; padding: 8px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: opacity 0.2s; }
        button:hover { opacity: 0.85; }
        
        .btn-accept { background: #00d68f; color: #000; }
        .btn-reject { background: #ff5555; color: #fff; }
        .btn-logout { background: #3d3f58; color: #fff; }
        
        .btn-sm { padding: 5px 10px; font-size: 12px; margin-right: 5px; }

        /* Table */
        table { width: 100%; border-collapse: collapse; background: #27293d; border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #3d3f58; }
        th { background: #32354a; color: #00d68f; }
        
        /* Status Badges */
        .status { padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 12px; display: inline-block; }
        .status-accepted { background: #00d68f; color: black; }
        .status-pending { background: #f1c40f; color: black; }
    </style>
</head>
<body>

    <header>
        <h1>Live Attendance Logs</h1>
        <button class="btn-logout" onclick="logout()">Logout</button>
    </header>

    <!-- Global Actions -->
    <div class="top-bar">
        <button class="btn-accept" id="btn-accept-all">Accept All</button>
        <button class="btn-reject" id="btn-reject-all">Reject All (Delete)</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>Log ID</th>
                <th>Student ID</th>
                <th>Scanned At</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="attendance-list">
            <tr><td colspan="5">Loading logs...</td></tr>
        </tbody>
    </table>

    <script type="module">
        import { supabase } from './supabase.js';

        // Session Check
        if (localStorage.getItem('admin_logged') !== 'true') {
            window.location.href = 'index.html';
        }

        const listContainer = document.getElementById('attendance-list');

        // Fetch logs
        async function fetchAttendance() {
            try {
                const { data, error } = await supabase
                    .from('attendance')
                    .select('*')
                    .order('scanned_at', { ascending: false })
                    .limit(20);

                if (error) throw error;

                if (!data || data.length === 0) {
                    listContainer.innerHTML = `<tr><td colspan="5">No attendance logs found.</td></tr>`;
                    return;
                }

                renderLogs(data);
            } catch (err) {
                console.error('Error loading attendance:', err);
                listContainer.innerHTML = `<tr><td colspan="5" style="color: #ff5555;">Error loading logs from Supabase</td></tr>`;
            }
        }

        // Render table records
        function renderLogs(logs) {
            listContainer.innerHTML = logs.map(log => {
                const currentStatus = (log.status || 'Pending').toLowerCase();
                let badgeClass = 'status-pending';
                if (currentStatus === 'accepted' || currentStatus === 'present') badgeClass = 'status-accepted';

                return `
                    <tr>
                        <td>${log.id}</td>
                        <td><strong>${log.student_id}</strong></td>
                        <td>${log.scanned_at ? new Date(log.scanned_at).toLocaleString() : 'N/A'}</td>
                        <td><span class="status ${badgeClass}">${log.status || 'Pending'}</span></td>
                        <td>
                            <button class="btn-accept btn-sm" onclick="acceptLog('${log.id}')">Accept</button>
                            <button class="btn-reject btn-sm" onclick="rejectAndDelete('${log.id}')">Reject</button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // Action: Accept individual log
        window.acceptLog = async function(id) {
            const { error } = await supabase
                .from('attendance')
                .update({ status: 'Accepted' })
                .eq('id', id);

            if (error) {
                alert(`Failed to accept log ${id}: ` + error.message);
            }
        };

        // Action: Reject individual log (Deletes record from database)
        window.rejectAndDelete = async function(id) {
            const { error } = await supabase
                .from('attendance')
                .delete()
                .eq('id', id);

            if (error) {
                alert(`Failed to delete log ${id}: ` + error.message);
            }
        };

        // Action: Accept All logs
        async function acceptAllLogs() {
            const { error } = await supabase
                .from('attendance')
                .update({ status: 'Accepted' })
                .neq('id', 0);

            if (error) {
                alert(`Failed to accept all logs: ` + error.message);
            }
        }

        // Action: Reject All logs (Deletes all records from database)
        async function rejectAllLogs() {
            if (!confirm("Are you sure you want to reject and delete all attendance logs?")) return;

            const { error } = await supabase
                .from('attendance')
                .delete()
                .neq('id', 0);

            if (error) {
                alert(`Failed to delete all logs: ` + error.message);
            }
        }

        // Event Listeners
        document.getElementById('btn-accept-all').addEventListener('click', acceptAllLogs);
        document.getElementById('btn-reject-all').addEventListener('click', rejectAllLogs);

        // Logout action
        window.logout = function() {
            localStorage.removeItem('admin_logged');
            window.location.href = 'index.html';
        };

        // Realtime Subscription: Listen for INSERT, UPDATE, and DELETE events
        supabase.channel('schema-db-changes')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'attendance' }, () => {
                fetchAttendance();
            })
            .subscribe();

        // Initial Load
        fetchAttendance();
    </script>
</body>
</html>
